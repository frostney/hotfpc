# hotfpc: hot reloading for Free Pascal programs.
# lwpt.cfg and lwpt.lock are generated by `lwpt install`; never edit them by hand.

[package]
name = "hotfpc"
version = "1.0.0"
units = ["source"]

[build]
# The driver includes build/generated/AgentSource.inc and Version.inc, written by the
# prebuild hooks below.
hotfpc = { source = "source/HotFPC.pas", output = "build/hotfpc", flags = ["-Fibuild/generated"] }

[prebuild]
embed-agent = { command = "instantfpc", args = ["scripts/EmbedAgent.pas"], inputs = ["source/HotFPC.Agent.pas", "source/Shared.inc", "scripts/EmbedAgent.pas"], output = "build/generated/AgentSource.inc" }
stamp-version = { command = "instantfpc", args = ["scripts/StampVersion.pas"], inputs = ["lwpt.toml", "scripts/StampVersion.pas"], output = "build/generated/Version.inc" }

[format]
include = ["scripts/*.pas"]
