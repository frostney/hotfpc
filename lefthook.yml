# hotfpc pre-commit hook (docs/tooling.md). Install once per clone: lefthook install
min_version: 1.5.0

pre-commit:
  piped: true
  commands:
    embed:
      priority: 1
      glob: "source/{HotFPC.Agent.pas,Shared.inc}"
      run: instantfpc build.pas embed && git add source/HotFPC.AgentSource.inc
    build-and-test:
      priority: 2
      glob: "*.{pas,inc}"
      run: instantfpc build.pas hotfpc tests
