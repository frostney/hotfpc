# hotfpc pre-commit hook (docs/internals/tooling.md). Install once per clone: lefthook install
min_version: 1.5.0

pre-commit:
  commands:
    build-and-test:
      glob: "*.{pas,rc}"
      run: ./build.sh hotfpc tests
    reference-docs:
      glob: "{source/*.pas,docs/reference/*.md,scripts/check-reference-docs.py}"
      run: python3 scripts/check-reference-docs.py
